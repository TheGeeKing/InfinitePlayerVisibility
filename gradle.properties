# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.16.3
fabric_version=0.151.0+26.1.2
modmenu_version=18.0.0-beta.1
junit_version=5.14.4
dependency_check_version=12.2.2

# Published compatibility ranges. Build against the pinned versions above, but
# allow compatible patch releases in the same Minecraft minor line.
compatible_minecraft_versions=>=26.1 <26.2
compatible_loader_versions=>=0.19.1
compatible_fabric_api_versions=>=0.145.1
compatible_modmenu_versions=>=18.0.0-alpha.8

# Mod Properties
archives_base_name=infinite-player-visibility
mod_version=1.2.3+26.1
maven_group=com.infiniteplayervisibility
